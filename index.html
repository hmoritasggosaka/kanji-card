  <meta name="theme-color" content="#1a1a2e">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#1a1a2e;--paper:#faf8f3;--accent:#c0392b;--muted:#8a8578;
  --card-bg:#fff;--border:#e2ddd5;--correct:#2d8a4e;--wrong:#c0392b;
  --correct-bg:#e8f5ee;--wrong-bg:#fdecea;--weak-bg:#fff8e8;--weak:#b8860b;
  --info-bg:#e8f0fe;--info:#1a56b0;
  --n5:#2E7D32;--n4:#c0392b;--n3:#6a1fa0;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:15px;overscroll-behavior:none;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:10;}
.app-title{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:700;letter-spacing:0.05em;}
.level-selector{display:flex;gap:5px;}
.lv-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:500;color:var(--muted);transition:all .2s;}
.lv-btn.active-n5{background:var(--n5);color:#fff;border-color:var(--n5);}
.lv-btn.active-n4{background:var(--n4);color:#fff;border-color:var(--n4);}
.lv-btn.active-n3{background:var(--n3);color:#fff;border-color:var(--n3);}

/* MODE TABS */
.mode-bar{display:flex;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:50px;z-index:9;}
.mode-btn{flex:1;padding:9px 4px;font-size:11px;border:none;background:none;cursor:pointer;color:var(--muted);font-family:'Noto Sans JP',sans-serif;border-bottom:2px solid transparent;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.mode-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.mode-icon{font-size:15px;}

/* PROGRESS */
.prog-wrap{padding:7px 16px 0;}
.prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}
.prog-label{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;}

/* RESUME BANNER */
.resume-banner{margin:8px 16px 0;background:var(--info-bg);border:1px solid #b3c8f0;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.resume-text{font-size:12px;color:var(--info);line-height:1.5;}
.resume-btn{font-size:11px;background:var(--info);color:#fff;border:none;border-radius:8px;padding:5px 10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;font-weight:500;}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--card-bg);color:var(--muted);cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .2s;position:relative;}
.cat-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.cat-dot{width:6px;height:6px;border-radius:50%;background:var(--correct);position:absolute;top:2px;right:2px;}

/* STATS */
.stats-row{display:flex;gap:5px;padding:0 16px 8px;}
.stat-box{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:6px 4px;text-align:center;}
.stat-num{font-size:16px;font-weight:700;font-family:'Noto Serif JP',serif;}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:1px;}
.c-ok{color:var(--correct)}.c-ng{color:var(--wrong)}.c-wk{color:var(--weak)}

main{flex:1;padding:0 16px 100px;}

/* FLASH CARD */
.card-scene{width:100%;perspective:1000px;margin-bottom:12px;}
.card-wrap{width:100%;height:260px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.card-wrap.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:16px;border:1px solid var(--border);background:var(--card-bg);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;}
.card-back{transform:rotateY(180deg);background:var(--ink);color:#fff;border-color:var(--ink);}
.hint-sm{font-size:11px;color:var(--muted);letter-spacing:.06em;}
.weak-flag{position:absolute;top:11px;right:11px;font-size:15px;}
.answered-flag{position:absolute;top:11px;left:11px;font-size:12px;padding:2px 7px;border-radius:10px;}
.af-ok{background:var(--correct-bg);color:var(--correct);}
.af-ng{background:var(--wrong-bg);color:var(--wrong);}
.sentence-display{font-size:18px;line-height:1.9;text-align:center;color:var(--ink);margin-bottom:6px;word-break:break-all;}
.sentence-display .target, #q-kanji .target{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--accent);font-weight:700;}
.kanji-label{font-size:11px;color:var(--muted);text-align:center;}
.back-sentence{font-size:14px;line-height:1.9;text-align:center;color:rgba(255,255,255,.85);margin-bottom:8px;word-break:break-all;}
.back-sentence .target-reading{color:#ffd97d;font-weight:700;border-bottom:2px solid #ffd97d;}
.back-reading-line{font-size:24px;font-weight:700;color:#fff;font-family:'Noto Serif JP',serif;margin-bottom:4px;text-align:center;letter-spacing:0.05em;}
.back-mean{font-size:12px;color:rgba(255,255,255,.65);text-align:center;line-height:1.6;padding:0 8px;}

/* BUTTONS */
.answer-row{display:flex;gap:10px;margin-bottom:9px;}
.abtn{flex:1;padding:14px 0;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:transform .15s;}
.abtn:active{transform:scale(.96);}
.abtn-ng{background:var(--wrong-bg);color:var(--wrong);border:1.5px solid #f5b8b8;font-weight:600;}
.abtn-ok{background:var(--correct);color:#fff;border:1.5px solid var(--correct);}
.nav-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:9px;}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.card-count{font-size:13px;color:var(--muted);min-width:54px;text-align:center;}
.tap-hint{font-size:12px;color:var(--accent);text-align:center;margin-bottom:7px;font-weight:500;letter-spacing:0.03em;}
.tool-row{display:flex;gap:7px;justify-content:center;margin-bottom:9px;}
.tool-btn{font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:20px;padding:4px 13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.tool-btn.active-mode{background:var(--ink);color:#fff;border-color:var(--ink);}

/* QUIZ */
.quiz-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px 18px;margin-bottom:14px;text-align:center;}
.quiz-q{font-size:13px;color:var(--muted);margin-bottom:14px;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.opt-btn{padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-align:left;transition:all .2s;font-weight:500;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);}
.opt-btn:disabled{cursor:default;}
.quiz-next{width:100%;padding:13px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:11px;}
.quiz-feedback{font-size:13px;text-align:center;padding:10px 12px;border-radius:10px;margin-top:9px;font-weight:500;line-height:1.6;}
.fb-ok{background:var(--correct-bg);color:var(--correct);}
.fb-ng{background:var(--wrong-bg);color:var(--wrong);}

/* WEAK */
.weak-empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px;line-height:1.8;}
.weak-item{display:flex;align-items:center;gap:11px;padding:11px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;}
.weak-k{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:700;min-width:34px;text-align:center;}
.weak-badge{font-size:11px;background:var(--weak-bg);color:var(--weak);border-radius:20px;padding:2px 8px;border:1px solid #f0d080;}
.weak-start-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-bottom:11px;}

/* HOME */
.streak-row{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;}
.streak-fire{font-size:28px;}
.streak-num{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;color:var(--accent);}
.streak-lbl{font-size:11px;color:var(--muted);}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
.summary-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;}
.summary-num{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:700;}
.summary-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.cat-progress-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:7px;}
.cat-progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.cat-progress-name{font-size:13px;font-weight:500;}
.cat-progress-pct{font-size:12px;color:var(--muted);}
.cat-progress-detail{display:flex;gap:10px;margin-top:5px;font-size:11px;color:var(--muted);}
.session-item{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:7px;}
.session-date{font-size:11px;color:var(--muted);margin-bottom:3px;}
.session-info{font-size:14px;font-weight:500;}
.session-detail{font-size:12px;color:var(--muted);margin-top:2px;}
.clear-btn{width:100%;padding:11px;border-radius:12px;border:1px solid #f0c0c0;background:var(--wrong-bg);color:var(--wrong);font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:18px;}

/* LEVEL BADGE in home */
.lv-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;margin-right:5px;vertical-align:middle;}
.lv-tag-n5{background:#e8f5e9;color:var(--n5);}
.lv-tag-n4{background:#fdecea;color:var(--n4);}
.lv-tag-n3{background:#f3e5fc;color:var(--n3);}

/* DONE */
.done-wrap{display:none;flex-direction:column;align-items:center;padding:36px 16px;text-align:center;}
.done-wrap.active{display:flex !important;}
.done-emoji{font-size:44px;margin-bottom:11px;}
.done-title{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;margin-bottom:7px;}
.done-sub{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:22px;white-space:pre-line;}
.done-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-bottom:9px;}
.done-btn2{background:none;border:1px solid var(--border);color:var(--ink);}

.section-label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;margin-top:16px;}
.section-label:first-child{margin-top:0;}
</style>
</head>
<body>

<header>
  <span class="app-title">漢字カード</span>
  <div class="level-selector">
    <button class="lv-btn" id="lv-n5" onclick="selectLevel('n5')">N5</button>
    <button class="lv-btn active-n4" id="lv-n4" onclick="selectLevel('n4')">N4</button>
    <button class="lv-btn" id="lv-n3" onclick="selectLevel('n3')">N3</button>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('home')" id="mode-home"><span class="mode-icon">📊</span>ホーム</button>
  <button class="mode-btn" onclick="setMode('flash')" id="mode-flash"><span class="mode-icon">📖</span>フラッシュ</button>
  <button class="mode-btn" onclick="setMode('quiz')" id="mode-quiz"><span class="mode-icon">❓</span>クイズ</button>
  <button class="mode-btn" onclick="setMode('weak')" id="mode-weak"><span class="mode-icon">⭐</span>苦手<span id="weak-cnt" style="font-size:10px;"></span></button>
</div>

<!-- HOME -->
<div id="home-section">
  <main style="padding-top:12px;"><div id="home-body"></div></main>
</div>

<!-- FLASH -->
<div id="flash-section" style="display:none">
  <div id="resume-banner" style="display:none" class="resume-banner">
    <div class="resume-text" id="resume-text">前回の続きから再開できます</div>
    <button class="resume-btn" onclick="resumeSession()">続きから</button>
  </div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="pbar" style="width:0%"></div></div>
    <div class="prog-label"><span id="plabel-l">0 / 0 枚完了</span><span id="plabel-r"></span></div>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="s-tot">0</div><div class="stat-lbl">回答</div></div>
    <div class="stat-box"><div class="stat-num c-ok" id="s-ok">0</div><div class="stat-lbl">正解</div></div>
    <div class="stat-box"><div class="stat-num c-ng" id="s-ng">0</div><div class="stat-lbl">不正解</div></div>
    <div class="stat-box"><div class="stat-num" id="s-rate">-</div><div class="stat-lbl">正解率</div></div>
  </div>
  <main id="flash-main">
    <div id="study-area">
      <div class="tool-row">
        <button class="tool-btn" onclick="shuffleCards()">シャッフル</button>
        <button class="tool-btn" onclick="toggleWeakOnly()" id="weak-only-btn">苦手のみ</button>
      </div>
      <div class="card-scene">
        <div class="card-wrap" id="card" onclick="flipCard()">
          <div class="card-face">
            <span class="answered-flag" id="ans-flag" style="display:none"></span>
            <span class="weak-flag" id="wflag" style="display:none">⭐</span>
            <div class="hint-sm" style="margin-bottom:9px;">下線部の読み方は？</div>
            <div class="sentence-display" id="sentence-display"></div>
            <div class="kanji-label" id="kanji-label"></div>
          </div>
          <div class="card-face card-back">
            <div class="back-sentence" id="back-sentence"></div>
            <div class="back-reading-line" id="back-reading-line"></div>
            <div class="back-mean" id="bmean">—</div>
          </div>
        </div>
      </div>
      <div class="tap-hint" id="tap-hint">カードをタップして答えを確認</div>
      <div class="answer-row" id="ans-row" style="display:none">
        <button class="abtn abtn-ng" onclick="answer(false)">❌ 不正解</button>
        <button class="abtn abtn-ok" onclick="answer(true)">✓ 正解</button>
      </div>
      <div class="nav-row">
        <button class="nav-btn" onclick="prev()">←</button>
        <span class="card-count" id="cc">1/1</span>
        <button class="nav-btn" onclick="next()">→</button>
      </div>
    </div>
    <div class="done-wrap" id="done-flash" style="display:none">
      <div class="done-emoji">🎉</div>
      <div class="done-title">セット完了！</div>
      <div class="done-sub" id="done-flash-msg"></div>
      <button class="done-btn" onclick="startQuizForCurrentCat()">クイズに挑戦 →</button>
      <button class="done-btn done-btn2" onclick="restartFlash()">もう一度</button>
    </div>
  </main>
</div>

<!-- QUIZ -->
<div id="quiz-section" style="display:none">
  <div class="cat-tabs" id="qcat-tabs" style="margin-top:8px;"></div>
  <main>
    <div id="quiz-area">
      <div class="quiz-card">
        <div id="q-kanji" style="font-size:17px;line-height:1.9;text-align:center;margin-bottom:5px;word-break:break-all;"></div>
        <div class="quiz-q" id="q-question">下線部の読み方は？</div>
        <div class="quiz-opts" id="q-opts"></div>
        <div class="quiz-feedback" id="q-fb" style="display:none"></div>
      </div>
      <div class="stats-row" style="padding:0 0 9px;">
        <div class="stat-box"><div class="stat-num" id="qs-tot">1</div><div class="stat-lbl">問目</div></div>
        <div class="stat-box"><div class="stat-num c-ok" id="qs-ok">0</div><div class="stat-lbl">正解</div></div>
        <div class="stat-box"><div class="stat-num c-ng" id="qs-ng">0</div><div class="stat-lbl">不正解</div></div>
        <div class="stat-box"><div class="stat-num" id="qs-rate">-</div><div class="stat-lbl">正解率</div></div>
      </div>
    </div>
    <div class="done-wrap" id="done-quiz">
      <div class="done-emoji">🏆</div>
      <div class="done-title">クイズ完了！</div>
      <div class="done-sub" id="done-quiz-msg"></div>
      <button class="done-btn" id="quiz-next-cat-btn" onclick="goNextCatFromQuiz()" style="display:none">次のカテゴリへ →</button>
      <button class="done-btn done-btn2" onclick="restartQuiz()">もう一度</button>
      <button class="done-btn done-btn2" onclick="setMode('weak')">苦手を復習 →</button>
    </div>
  </main>
</div>

<!-- WEAK -->
<div id="weak-section" style="display:none">
  <main style="padding-top:11px;">
    <div id="weak-list-area"></div>
    <div class="done-wrap" id="done-weak">
      <div class="done-emoji">💪</div>
      <div class="done-title">苦手克服完了！</div>
      <div class="done-sub" id="done-weak-msg"></div>
      <button class="done-btn" onclick="restartWeak()">もう一度復習</button>
      <button class="done-btn done-btn2" onclick="setMode('flash')">フラッシュカードへ</button>
    </div>
  </main>
</div>

// ===================== STATE =====================
const STORAGE_KEY = 'jlpt_kanji_v2';
let currentLevel = 'n4';
let ALL_DATA = LEVELS.n4.data;
let CATS = Object.keys(ALL_DATA);

let mode='home', flashCat=CATS[0], flashCards=[], flashIdx=0, flashFlipped=false, isRestart=false;
let flashAnswered=[], flashCorrect=0, flashWrong=0, weakOnlyMode=false;
let quizCat=CATS[0], quizCards=[], quizIdx=0, quizCorrect=0, quizWrong=0, quizAnswered=false, quizAnsweredMap={};
let weakCards=[], weakIdx=0, weakCorrect=0, weakWrong=0, weakFlipped=false, weakAnswered=[];
let weakSet=new Set();
let savedProgress = { weakSet:{}, catProgress:{}, sessions:[], lastSession:{}, totalStudyDays:[] };

// ===================== STORAGE =====================
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); savedProgress = { ...savedProgress, ...p }; }
    weakSet = new Set(savedProgress.weakSet[currentLevel] || []);
  } catch(e) {}
  // 長さ不一致の古いデータを全レベル・全カテゴリで一括クリア
  try {
    ['n5','n4','n3'].forEach(lv => {
      // lastSession の検証
      const ls = savedProgress.lastSession && savedProgress.lastSession[lv];
      if (ls && ls.cat && ls.answered) {
        const expected = ALL_DATA && ALL_DATA[ls.cat] ? ALL_DATA[ls.cat].length : 0;
        if (ls.answered.length !== expected) {
          savedProgress.lastSession[lv] = null;
        }
      }
      // catProgress の検証
      const cp = savedProgress.catProgress && savedProgress.catProgress[lv];
      if (cp) {
        Object.keys(cp).forEach(cat => {
          const expected = ALL_DATA && ALL_DATA[cat] ? ALL_DATA[cat].length : 0;
          if (cp[cat].answered && cp[cat].answered.length !== expected) {
            delete cp[cat];
          }
        });
      }
    });
    saveProgress();
  } catch(e) {}
}
function saveProgress() {
  try {
    if (!savedProgress.weakSet) savedProgress.weakSet = {};
    savedProgress.weakSet[currentLevel] = [...weakSet];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedProgress));
  } catch(e) {}
}
function saveSession(catName, modeStr, correct, wrong) {
  const total = correct + wrong;
  if (total === 0) return;
  const rate = Math.round(correct / total * 100);
  const now = new Date();
  const dateStr = now.toLocaleDateString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  if (!savedProgress.sessions) savedProgress.sessions = [];
  savedProgress.sessions.unshift({ date:dateStr, level:currentLevel, cat:catName, mode:modeStr, correct, wrong, total, rate });
  if (savedProgress.sessions.length > 50) savedProgress.sessions = savedProgress.sessions.slice(0,50);
  const dayStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  if (!savedProgress.totalStudyDays) savedProgress.totalStudyDays = [];
  if (!savedProgress.totalStudyDays.includes(dayStr)) savedProgress.totalStudyDays.push(dayStr);
  saveProgress();
}
function saveMidSession(cat, idx, answered, correct, wrong) {
  if (!savedProgress.lastSession) savedProgress.lastSession = {};
  if (idx === 0 && answered.every(a => a === null)) { savedProgress.lastSession[currentLevel] = null; }
  else { savedProgress.lastSession[currentLevel] = { cat, idx, answered:[...answered], correct, wrong }; }
  saveProgress();
}
function saveCatProgress(cat, answered, correct, wrong) {
  if (!savedProgress.catProgress) savedProgress.catProgress = {};
  if (!savedProgress.catProgress[currentLevel]) savedProgress.catProgress[currentLevel] = {};
  savedProgress.catProgress[currentLevel][cat] = { answered:[...answered], correct, wrong };
  saveProgress();
}

// ===================== LEVEL =====================
function selectLevel(lv) {
  currentLevel = lv;
  ALL_DATA = LEVELS[lv].data;
  CATS = Object.keys(ALL_DATA);
  flashCat = CATS[0];
  quizCat = CATS[0];
  // Reload latest storage data and update weakSet for this level
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      savedProgress = { weakSet:{}, catProgress:{}, sessions:[], lastSession:{}, totalStudyDays:[], ...p };
    }
  } catch(e) {}
  weakSet = new Set(savedProgress.weakSet[currentLevel] || []);
  // レベル切替時は続きバナーを非表示に
  const banner = document.getElementById('resume-banner');
  if (banner) banner.style.display = 'none';
  ['n5','n4','n3'].forEach(l => {
    const b = document.getElementById('lv-'+l);
    b.className = 'lv-btn' + (l===lv ? ' active-'+l : '');
  });
  updateWeakCnt();
  setMode('home');
}

// ===================== MODE =====================
function startFlashFromHome(cat) {
  flashCat = cat;
  quizCat = cat;
  setMode('flash');
}

function setMode(m) {
  mode = m;
  ['home','flash','quiz','weak'].forEach(x => {
    const sec = document.getElementById(x+'-section');
    if (sec) sec.style.display = x===m ? '' : 'none';
    const btn = document.getElementById('mode-'+x);
    if (btn) btn.classList.toggle('active', x===m);
  });
  if (m==='home')  renderHome();
  if (m==='flash') { initFlash(flashCat || null); checkResumeBanner(); }
  if (m==='quiz')  initQuiz();
  if (m==='weak')  initWeak();
  updateWeakCnt();
}

// ===================== FLASH =====================
function buildCatTabs(id, cur, fn) {
  const el = document.getElementById(id); el.innerHTML='';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-tab' + (c===cur?' active':'');
    b.textContent = c;
    const cp = savedProgress.catProgress && savedProgress.catProgress[currentLevel] && savedProgress.catProgress[currentLevel][c];
    if (cp && cp.answered && cp.answered.some(a=>a!==null)) {
      const dot = document.createElement('span'); dot.className='cat-dot'; b.appendChild(dot);
    }
    b.onclick = () => fn(c);
    el.appendChild(b);
  });
}

function checkResumeBanner() {
  const ls = savedProgress.lastSession && savedProgress.lastSession[currentLevel];
  const banner = document.getElementById('resume-banner');
  if (ls && ls.cat && ls.idx > 0 && ls.answered && ls.answered.length === (ALL_DATA[ls.cat] ? ALL_DATA[ls.cat].length : 0)) {
    const done = ls.answered.filter(a=>a!==null).length;
    const total = ALL_DATA[ls.cat].length;
    document.getElementById('resume-text').textContent = `「${ls.cat}」の続きから再開 (${done}/${total}枚)`;
    banner.style.display = 'flex';
  } else {
    // 長さ不一致の古いデータは削除
    if (ls && ls.cat && ls.answered && ls.answered.length !== (ALL_DATA[ls.cat] ? ALL_DATA[ls.cat].length : 0)) {
      savedProgress.lastSession[currentLevel] = null;
      saveProgress();
    }
    banner.style.display = 'none';
  }
}

function resumeSession() {
  const ls = savedProgress.lastSession && savedProgress.lastSession[currentLevel];
  if (!ls) return;
  flashCat = ls.cat;
  flashCards = [...ALL_DATA[flashCat]];
  // 保存データの長さが現在のカード枚数と合わない場合は無効化
  if (!ls.answered || ls.answered.length !== flashCards.length) {
    savedProgress.lastSession[currentLevel] = null;
    saveProgress();
    document.getElementById('resume-banner').style.display = 'none';
    goFlash();
    return;
  }
  flashIdx = ls.idx;
  flashAnswered = [...ls.answered];
  flashCorrect = ls.correct;
  flashWrong = ls.wrong;
  flashFlipped = false; weakOnlyMode = false;
  document.getElementById('weak-only-btn').textContent = '苦手のみ';
  document.getElementById('done-flash').style.display = 'none';
  document.getElementById('study-area').style.display = '';
  document.getElementById('card').onclick = flipCard;
  document.getElementById('resume-banner').style.display = 'none';
  buildCatTabs('cat-tabs', flashCat, c=>initFlash(c));
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('ans-row').style.display = 'none';
  document.getElementById('tap-hint').textContent = 'カードをタップして答えを確認';
  updateFlashCard(); updateFlashStats(); updateFlashProg();
}

function initFlash(cat) {
  if (cat) {
    flashCat = cat;
  } else {
    // カテゴリ未指定の場合、未完了の最初のカテゴリを自動選択
    const cp = savedProgress.catProgress && savedProgress.catProgress[currentLevel];
    const firstIncomplete = CATS.find(c => {
      const p = cp && cp[c];
      const total = ALL_DATA[c].length;
      const done = p && p.answered ? p.answered.filter(a=>a!==null).length : 0;
      return done < total;
    });
    flashCat = firstIncomplete || CATS[0];
  }
  weakOnlyMode = false;
  isRestart = false;
  document.getElementById('weak-only-btn').textContent = '苦手のみ';
  document.getElementById('weak-only-btn').classList.remove('active-mode');
  flashCards = [...ALL_DATA[flashCat]];
  flashIdx = 0; flashFlipped = false; flashCorrect = 0; flashWrong = 0;
  flashAnswered = new Array(flashCards.length).fill(null);
  const ls = savedProgress.lastSession && savedProgress.lastSession[currentLevel];
  const cp = savedProgress.catProgress && savedProgress.catProgress[currentLevel] && savedProgress.catProgress[currentLevel][flashCat];
  if (ls && ls.cat === flashCat && ls.idx > 0 && ls.answered && ls.answered.length === flashCards.length) {
    flashIdx=ls.idx; flashAnswered=[...ls.answered]; flashCorrect=ls.correct; flashWrong=ls.wrong;
  } else if (cp && cp.answered && cp.answered.length === flashCards.length) {
    flashAnswered=[...cp.answered]; flashCorrect=cp.correct; flashWrong=cp.wrong;
  }
  buildCatTabs('cat-tabs', flashCat, c=>initFlash(c));
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('ans-row').style.display='none';
  document.getElementById('tap-hint').textContent='カードをタップして答えを確認';
  updateFlashCard(); updateFlashStats(); updateFlashProg();
  // 全問回答済みの場合は完了画面を表示
  const allDone = flashAnswered.every(a => a !== null);
  if (allDone) {
    showFlashDone();
  } else {
    document.getElementById('done-flash').style.display = 'none';
    document.getElementById('study-area').style.display = '';
    document.getElementById('card').onclick = flipCard;
  }
}

function toggleWeakOnly() {
  if (weakSet.size===0) { alert('まだ苦手な漢字がありません！'); return; }
  weakOnlyMode = !weakOnlyMode;
  document.getElementById('weak-only-btn').textContent = weakOnlyMode?'全て表示':'苦手のみ';
  document.getElementById('weak-only-btn').classList.toggle('active-mode', weakOnlyMode);
  const base = ALL_DATA[flashCat];
  flashCards = weakOnlyMode ? base.filter(c=>weakSet.has(c.k)) : [...base];
  flashIdx=0; flashFlipped=false;
  flashAnswered=new Array(flashCards.length).fill(null);
  flashCorrect=0; flashWrong=0;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('ans-row').style.display='none';
  updateFlashCard(); updateFlashStats(); updateFlashProg();
}

function buildSentenceHTML(sentence, kanji, cls, mReading) {
  const idx = sentence.indexOf('__');
  if (idx < 0) return sentence.replace('__', `<span class="${cls}">${kanji}</span>`);
  // 直前の漢字
  const prevChar = idx > 0 ? sentence[idx - 1] : '';
  const before = (prevChar >= '\u4e00' && prevChar <= '\u9fff') ? prevChar : '';
  // 直後の漢字
  const nextChar = sentence.length > idx + 2 ? sentence[idx + 2] : '';
  const afterKanji = (nextChar >= '\u4e00' && nextChar <= '\u9fff') ? nextChar : '';
  // 直後のひらがな（mReadingの末尾と一致する分）
  let trailingHira = '';
  if (!afterKanji && mReading) {
    let avail = '';
    let i = idx + 2;
    while (i < sentence.length) {
      const ch = sentence[i];
      if (ch >= '\u3041' && ch <= '\u309f') { avail += ch; i++; } else break;
    }
    for (let end = avail.length; end > 0; end--) {
      const portion = avail.slice(0, end);
      if (mReading.endsWith(portion)) { trailingHira = portion; break; }
    }
  }
  const fullWord = before + kanji + afterKanji + trailingHira;
  const start = idx - before.length;
  const end = idx + 2 + afterKanji.length + trailingHira.length;
  return sentence.slice(0, start) + `<span class="${cls}">${fullWord}</span>` + sentence.slice(end);
}
function buildReadingSentence(tr, r) {
  const escaped = r.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return tr.replace(new RegExp(escaped), `<span class="target-reading">${r}</span>`);
}
function getHighlightedWord(sentence, kanji, mReading) {
  const idx = sentence.indexOf('__');
  if (idx < 0) return kanji;
  // 直前の漢字
  const prevChar = idx > 0 ? sentence[idx - 1] : '';
  const before = (prevChar >= '\u4e00' && prevChar <= '\u9fff') ? prevChar : '';
  // 直後の漢字
  const nextCharCode = sentence.length > idx + 2 ? sentence[idx + 2] : '';
  const afterKanji = (nextCharCode >= '\u4e00' && nextCharCode <= '\u9fff') ? nextCharCode : '';
  // __ 直後のひらがな（mReadingの末尾と一致する分だけ取得）
  let trailingHira = '';
  if (!afterKanji && mReading) {
    let avail = '';
    let i = idx + 2;
    while (i < sentence.length) {
      const ch = sentence[i];
      if (ch >= '\u3041' && ch <= '\u309f') { avail += ch; i++; } else break;
    }
    for (let end = avail.length; end > 0; end--) {
      const portion = avail.slice(0, end);
      if (mReading.endsWith(portion)) { trailingHira = portion; break; }
    }
  }
  return before + kanji + afterKanji + trailingHira;
}
function getFullReading(sentence, kanji, r, tr, m) {
  // mフィールドから「語（読み）」を抽出
  const mWordMatch = m.match(/\u300c([^\uff08\uff09\u300d]+)/);
  const mReadMatch = m.match(/\uff08([^\uff09]+)\uff09/);
  if (!mWordMatch || !mReadMatch) return r;
  const mWord = mWordMatch[1];
  const mReading = mReadMatch[1];
  // 下線部の表示語（mReadingを使って末尾ひらがなを確定）
  const word = getHighlightedWord(sentence, kanji, mReading);
  // 表示語の漢字部分が一致し読みがtrに含まれる場合
  const kanjiOnly = (str) => str.replace(/[^\u4e00-\u9fff]/g, '');
  if (kanjiOnly(mWord) === kanjiOnly(word) && tr.indexOf(mReading) >= 0) {
    return mReading;
  }
  return r;
}

function updateFlashCard() {
  const c = flashCards[flashIdx];
  const fullR = getFullReading(c.s, c.k, c.r, c.tr, c.m);
  document.getElementById('sentence-display').innerHTML = buildSentenceHTML(c.s, c.k, 'target', fullR);
  const mReadMatch1 = c.m.match(/（([^）]+)）/);
  const mR1 = mReadMatch1 ? mReadMatch1[1] : undefined;
  document.getElementById('kanji-label').textContent = '「'+getHighlightedWord(c.s, c.k, mR1)+'」の読み方は？';
  document.getElementById('back-sentence').innerHTML = buildReadingSentence(c.tr, fullR);
  document.getElementById('back-reading-line').textContent = fullR;
  document.getElementById('bmean').textContent = c.m;
  document.getElementById('cc').textContent = (flashIdx+1)+'/'+flashCards.length;
  document.getElementById('wflag').style.display = weakSet.has(c.k)?'':'none';
  const af = document.getElementById('ans-flag');
  const ans = flashAnswered[flashIdx];
  if (ans===true) { af.style.display=''; af.className='answered-flag af-ok'; af.textContent='✓'; }
  else if (ans===false) { af.style.display=''; af.className='answered-flag af-ng'; af.textContent='✗'; }
  else { af.style.display='none'; }
}

function flipCard() {
  flashFlipped = !flashFlipped;
  document.getElementById('card').classList.toggle('flipped', flashFlipped);
  document.getElementById('ans-row').style.display = flashFlipped?'flex':'none';
  document.getElementById('tap-hint').textContent = flashFlipped?'正解でしたか？':'カードをタップして答えを確認';
}

function answer(ok) {
  // 二重発火防止
  const ansRow = document.getElementById('ans-row');
  ansRow.style.display='none';
  document.getElementById('card').onclick = null;
  // ナビボタンをdisabledで無効化（iOSでもpointerEventsより確実）
  document.querySelectorAll('.nav-btn').forEach(b => b.disabled = true);

  const c = flashCards[flashIdx];
  if (ok) weakSet.delete(c.k); else weakSet.add(c.k);
  if (flashAnswered[flashIdx]===null) {
    if (ok) flashCorrect++; else flashWrong++;
    flashAnswered[flashIdx]=ok;
  } else {
    if (flashAnswered[flashIdx]&&!ok){flashCorrect--;flashWrong++;}
    else if(!flashAnswered[flashIdx]&&ok){flashWrong--;flashCorrect++;}
    flashAnswered[flashIdx]=ok;
  }
  updateFlashStats(); updateWeakCnt();
  saveMidSession(flashCat, flashIdx, flashAnswered, flashCorrect, flashWrong);
  if (!isRestart) saveCatProgress(flashCat, flashAnswered, flashCorrect, flashWrong);

  const answeredCount = flashAnswered.filter(a => a !== null).length;
  const allDone = answeredCount === flashCards.length;

  setTimeout(() => {
    document.querySelectorAll('.nav-btn').forEach(b => b.disabled = false);
    document.getElementById('card').onclick = flipCard;
    if (allDone) {
      showFlashDone();
    } else {
      nextFlash();
    }
  }, 600);
}

function nextFlash() {
  // 全問回答済みなら完了
  if (flashAnswered.every(a => a !== null)) { showFlashDone(); return; }
  if (flashIdx < flashCards.length - 1) {
    flashIdx++;
    // 次のカードが最後(idx===length-1)で、他が全部回答済みなら完了画面へ
    const othersAllDone = flashAnswered.every((a, i) => i === flashIdx || a !== null);
    if (flashIdx === flashCards.length - 1 && othersAllDone) {
      showFlashDone(); return;
    }
    goFlash();
  } else {
    showFlashDone();
  }
}
function prev() { if(flashIdx>0){flashIdx--;goFlash();} }
function next() { nextFlash(); }

function goFlash() {
  // transitionを一瞬無効にして即座に表向きへ戻す（答えが透けて見えないように）
  flashFlipped = false;
  const cardEl = document.getElementById('card');
  cardEl.style.transition = 'none';
  cardEl.classList.remove('flipped');
  document.getElementById('sentence-display').innerHTML = '';
  document.getElementById('kanji-label').textContent = '';
  document.getElementById('back-reading-line').textContent = '';
  document.getElementById('bmean').textContent = '';
  document.getElementById('ans-row').style.display = 'none';
  document.getElementById('tap-hint').textContent = 'カードをタップして答えを確認';

  // 次フレームでtransitionを復活させてから内容をセット
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      cardEl.style.transition = '';
      const thisIdx = flashIdx;
      if (flashAnswered[flashIdx] !== null) {
        updateFlashCard();
        setTimeout(() => {
          if (flashIdx !== thisIdx) return;
          flashFlipped = true;
          cardEl.classList.add('flipped');
          document.getElementById('ans-row').style.display = 'flex';
          document.getElementById('tap-hint').textContent = '正解でしたか？';
        }, 150);
      } else {
        updateFlashCard();
      }
    });
  });

  updateFlashProg();
  saveMidSession(flashCat, flashIdx, flashAnswered, flashCorrect, flashWrong);
}

function shuffleCards() {
  const orig=[...ALL_DATA[flashCat]];
  const shuffled=sfl([...orig]);
  const oldAns={}; orig.forEach((c,i)=>{oldAns[c.k]=flashAnswered[i];});
  flashCards=shuffled;
  flashAnswered=shuffled.map(c=>oldAns[c.k]!==undefined?oldAns[c.k]:null);
  flashIdx=0; goFlash();
}

function updateFlashStats() {
  const tot=flashCorrect+flashWrong;
  document.getElementById('s-tot').textContent=tot;
  document.getElementById('s-ok').textContent=flashCorrect;
  document.getElementById('s-ng').textContent=flashWrong;
  document.getElementById('s-rate').textContent=tot>0?Math.round(flashCorrect/tot*100)+'%':'-';
}
function updateFlashProg() {
  const done=flashAnswered.filter(a=>a!==null).length;
  const pct=Math.round(done/flashCards.length*100);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('plabel-l').textContent=done+' / '+flashCards.length+' 枚完了';
  document.getElementById('plabel-r').textContent=weakSet.size>0?'⭐'+weakSet.size+'個':'';
  // 最後のカードかつ未回答の場合は「→」をグレーアウト
  const nextBtn = document.querySelector('.nav-row .nav-btn:last-child');
  if (nextBtn) {
    const isLastUnanswered = flashIdx === flashCards.length - 1 && flashAnswered[flashIdx] === null;
    nextBtn.disabled = isLastUnanswered;
    nextBtn.style.opacity = isLastUnanswered ? '0.3' : '';
  }
}
function showFlashDone() {
  isRestart = false;
  document.getElementById('study-area').style.display = 'none';
  document.getElementById('done-flash').style.display = 'flex';
  const tot = flashCorrect + flashWrong;
  const rate = tot > 0 ? Math.round(flashCorrect / tot * 100) : 0;
  document.getElementById('done-flash-msg').textContent =
    flashCat + '完了！\n正解率 ' + rate + '% (' + flashCorrect + '/' + tot + ')\n' +
    (rate >= 80 ? 'すばらしい！' : rate >= 60 ? 'よく頑張りました！' : 'もう少し練習してみましょう。');
  saveCatProgress(flashCat, flashAnswered, flashCorrect, flashWrong);
  saveSession(flashCat, 'フラッシュ', flashCorrect, flashWrong);
  if (savedProgress.lastSession) savedProgress.lastSession[currentLevel] = null;
  saveProgress();
}
function goNextCatFromQuiz() {
  const currentIdx = CATS.indexOf(quizCat);
  const nextCat = CATS[currentIdx + 1];
  if (nextCat) {
    flashCat = nextCat;
    quizCat = nextCat;
    setMode('flash');
  } else {
    setMode('home');
  }
}
function startQuizForCurrentCat() {
  // フラッシュカードと同じカテゴリでクイズを開始
  quizCat = flashCat;
  setMode('quiz');
}
function restartFlash() {
  document.getElementById('done-flash').style.display = 'none';
  document.getElementById('study-area').style.display = '';
  document.getElementById('card').onclick = flipCard;
  isRestart = true;
  flashAnswered = new Array(ALL_DATA[flashCat].length).fill(null);
  flashCorrect = 0; flashWrong = 0; flashIdx = 0;
  flashCards = [...ALL_DATA[flashCat]];
  updateFlashCard(); updateFlashStats(); updateFlashProg();
}

// ===================== QUIZ =====================
function sfl(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function initQuiz(cat) {
  if (cat) {
    quizCat = cat;
  } else {
    // カテゴリ未指定の場合、直前のフラッシュカードと同じカテゴリを引き継ぐ
    // （flashCatが設定済みなら合わせる、未設定なら未完了の最初のカテゴリ）
    quizCat = flashCat || quizCat;
  }
  quizCards=sfl([...ALL_DATA[quizCat]]);
  quizIdx=0; quizCorrect=0; quizWrong=0; quizAnsweredMap={};
  document.getElementById('done-quiz').classList.remove('active');
  document.getElementById('quiz-area').style.display='';
  buildCatTabs('qcat-tabs', quizCat, c=>initQuiz(c));
  buildQuiz();
}
function buildQuiz() {
  if (quizIdx>=quizCards.length){showQuizDone();return;}
  const c=quizCards[quizIdx];
  const mReadMatch2 = c.m.match(/（([^）]+)）/);
  const mR2 = mReadMatch2 ? mReadMatch2[1] : undefined;
  document.getElementById('q-kanji').innerHTML=buildSentenceHTML(c.s,c.k,'target',mR2);
  document.getElementById('q-question').textContent='下線部「'+getHighlightedWord(c.s, c.k, mR2)+'」の読み方は？';
  document.getElementById('q-fb').style.display='none';
  quizAnswered=false;
  const correctR = getFullReading(c.s, c.k, c.r, c.tr, c.m);
  // Draw wrong options from ALL categories for more variety
  const allPool = CATS.flatMap(cat => ALL_DATA[cat]).filter(x => x.k !== c.k);
  // Prefer options with different readings to avoid confusingly similar choices
  const shuffled = sfl([...allPool]);
  // Filter out options with same reading as correct answer
  const differentR = shuffled.filter(x => getFullReading(x.s,x.k,x.r,x.tr,x.m) !== correctR);
  const sameR = shuffled.filter(x => getFullReading(x.s,x.k,x.r,x.tr,x.m) === correctR && x.k !== c.k);
  const wrong3 = differentR.slice(0, 3);
  const opts=sfl([c,...wrong3]);
  const container=document.getElementById('q-opts'); container.innerHTML='';
  opts.forEach(opt=>{
    const b=document.createElement('button'); b.className='opt-btn';
    b.textContent=getFullReading(opt.s, opt.k, opt.r, opt.tr, opt.m);
    b.onclick=()=>selectOpt(b,opt.k===c.k,c,correctR);
    container.appendChild(b);
  });
  updateQuizStats();
}
function selectOpt(btn,isCorrect,card,correctR) {
  if(quizAnswered)return;
  quizAnswered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(isCorrect){
    btn.classList.add('correct'); quizCorrect++; weakSet.delete(card.k);
    quizAnsweredMap[card.k] = true;
    document.getElementById('q-fb').className='quiz-feedback fb-ok';
    document.getElementById('q-fb').textContent='正解！　'+card.tr;
  } else {
    btn.classList.add('wrong'); quizWrong++; weakSet.add(card.k);
    quizAnsweredMap[card.k] = false;
    const fb=document.getElementById('q-fb');
    fb.className='quiz-feedback fb-ng';
    fb.textContent='不正解。正解：「'+correctR+'」　'+card.tr;
    document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===correctR)b.classList.add('correct');});
  }
  document.getElementById('q-fb').style.display='block';
  updateQuizStats(); updateWeakCnt(); saveProgress();
  const nb=document.createElement('button'); nb.className='quiz-next';
  nb.textContent=quizIdx<quizCards.length-1?'次の問題 →':'結果を見る';
  nb.onclick=()=>{quizIdx++;buildQuiz();nb.remove();};
  document.getElementById('q-opts').after(nb);
}
function updateQuizStats() {
  const tot=quizCorrect+quizWrong;
  document.getElementById('qs-tot').textContent=quizIdx+1;
  document.getElementById('qs-ok').textContent=quizCorrect;
  document.getElementById('qs-ng').textContent=quizWrong;
  document.getElementById('qs-rate').textContent=tot>0?Math.round(quizCorrect/tot*100)+'%':'-';
}
function showQuizDone() {
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('done-quiz').classList.add('active');
  const tot=quizCorrect+quizWrong;
  const rate=tot>0?Math.round(quizCorrect/tot*100):0;
  document.getElementById('done-quiz-msg').textContent=
    quizCat+' クイズ完了！\n正解率 '+rate+'% ('+quizCorrect+'/'+tot+')\n'+
    (rate>=80?'すばらしい！':rate>=60?'よく頑張りました！':'苦手を復習してみましょう。');
  // 次のカテゴリがあればボタンを表示
  const nextBtn = document.getElementById('quiz-next-cat-btn');
  if (nextBtn) {
    const currentIdx = CATS.indexOf(quizCat);
    const nextCat = CATS[currentIdx + 1];
    if (nextCat) {
      nextBtn.textContent = '「' + nextCat + '」へ →';
      nextBtn.style.display = '';
    } else {
      nextBtn.style.display = 'none';
    }
  }
  // クイズ結果をカテゴリ進捗に保存
  const quizAnsweredArr = quizCards.map(c => quizAnsweredMap[c.k] !== undefined ? quizAnsweredMap[c.k] : null);
  saveCatProgress(quizCat, quizAnsweredArr, quizCorrect, quizWrong);
  saveSession(quizCat,'クイズ',quizCorrect,quizWrong);
}
function restartQuiz(){document.getElementById('done-quiz').classList.remove('active');document.getElementById('quiz-area').style.display='';initQuiz();}

// ===================== WEAK =====================
function initWeak() {
  weakCards=[];
  CATS.forEach(cat=>{ALL_DATA[cat].forEach(c=>{if(weakSet.has(c.k))weakCards.push(c);});});
  weakCards=sfl([...weakCards]);
  weakIdx=0; weakFlipped=false; weakCorrect=0; weakWrong=0;
  weakAnswered=new Array(weakCards.length).fill(null);
  document.getElementById('done-weak').classList.remove('active');
  renderWeakList();
}
function renderWeakList() {
  const area=document.getElementById('weak-list-area'); area.innerHTML='';
  if(weakCards.length===0){
    area.innerHTML='<div class="weak-empty">⭐ まだ苦手な漢字がありません。<br>フラッシュカードやクイズで<br>間違えた漢字がここに追加されます。</div>';
    return;
  }
  const startBtn=document.createElement('button'); startBtn.className='weak-start-btn';
  startBtn.textContent='苦手'+weakCards.length+'字をフラッシュカードで復習';
  startBtn.onclick=startWeakFlash; area.appendChild(startBtn);
  weakCards.forEach(c=>{
    const fullR = getFullReading(c.s, c.k, c.r, c.tr, c.m);
    const d=document.createElement('div'); d.className='weak-item';
    d.innerHTML='<div class="weak-k">'+c.k+'</div><div style="flex:1"><div style="font-size:13px;font-weight:500;">'+fullR+'</div><div style="font-size:12px;color:var(--muted)">'+c.m+'</div></div><span class="weak-badge">苦手</span>';
    area.appendChild(d);
  });
}
function startWeakFlash(){
  weakIdx=0; weakFlipped=false; weakCorrect=0; weakWrong=0;
  weakAnswered=new Array(weakCards.length).fill(null);
  buildWeakFlash();
}
function buildWeakFlash(){
  const area=document.getElementById('weak-list-area'); area.innerHTML='';
  if(weakCards.length===0){renderWeakList();return;}
  const c=weakCards[weakIdx];
  const fullR=getFullReading(c.s,c.k,c.r,c.tr,c.m);
  const frontSent=buildSentenceHTML(c.s,c.k,'target',fullR);
  const backSent=buildReadingSentence(c.tr,fullR);
  area.innerHTML=`
    <div class="stats-row" style="margin-bottom:9px">
      <div class="stat-box"><div class="stat-num">${weakCards.length}</div><div class="stat-lbl">苦手数</div></div>
      <div class="stat-box"><div class="stat-num c-ok">${weakCorrect}</div><div class="stat-lbl">正解</div></div>
      <div class="stat-box"><div class="stat-num c-ng">${weakWrong}</div><div class="stat-lbl">不正解</div></div>
      <div class="stat-box"><div class="stat-num">${weakIdx+1}/${weakCards.length}</div><div class="stat-lbl">進捗</div></div>
    </div>
    <div class="card-scene">
      <div class="card-wrap" id="wcard" onclick="flipWeak()">
        <div class="card-face">
          <span style="font-size:11px;color:var(--weak);margin-bottom:7px;">⭐苦手</span>
          <div class="hint-sm" style="margin-bottom:8px;">下線部の読み方は？</div>
          <div class="sentence-display">${frontSent}</div>
          <div class="kanji-label">「${getHighlightedWord(c.s, c.k, fullR)}」の読み方は？</div>
        </div>
        <div class="card-face card-back">
          <div class="back-sentence">${backSent}</div>
          <div class="back-reading-line">${fullR}</div>
          <div class="back-mean">${c.m}</div>
        </div>
      </div>
    </div>
    <div class="tap-hint" id="w-tap">カードをタップして答えを確認</div>
    <div class="answer-row" id="w-ans" style="display:none">
      <button class="abtn abtn-ng" onclick="answerWeak(false)">❌ まだ苦手</button>
      <button class="abtn abtn-ok" onclick="answerWeak(true)">✓ 覚えた！</button>
    </div>`;
  weakFlipped=false;
}
function flipWeak(){
  weakFlipped=!weakFlipped;
  const wc=document.getElementById('wcard'); if(wc)wc.classList.toggle('flipped',weakFlipped);
  const wr=document.getElementById('w-ans'); if(wr)wr.style.display=weakFlipped?'flex':'none';
  const wt=document.getElementById('w-tap'); if(wt)wt.textContent=weakFlipped?'覚えましたか？':'カードをタップして答えを確認';
}
function answerWeak(ok){
  const c=weakCards[weakIdx];
  if(ok){weakSet.delete(c.k);weakCorrect++;}else{weakWrong++;}
  weakAnswered[weakIdx]=ok; updateWeakCnt(); saveProgress();
  if(weakIdx<weakCards.length-1){weakIdx++;setTimeout(()=>buildWeakFlash(),300);}
  else{setTimeout(()=>showWeakDone(),300);}
}
function showWeakDone(){
  document.getElementById('weak-list-area').style.display='none';
  document.getElementById('done-weak').classList.add('active');
  const rate=weakCards.length>0?Math.round(weakCorrect/weakCards.length*100):0;
  document.getElementById('done-weak-msg').textContent=
    '苦手'+weakCards.length+'字の復習完了！\n正解率 '+rate+'%\n'+
    (rate>=80?'よく頑張りました！':rate>=60?'着実に上達しています！':'繰り返し練習しましょう！');
  saveSession('苦手復習','苦手',weakCorrect,weakWrong);
}
function restartWeak(){
  document.getElementById('done-weak').classList.remove('active');
  document.getElementById('weak-list-area').style.display='';
  initWeak();
}
function updateWeakCnt(){
  const el=document.getElementById('weak-cnt');
  el.textContent=weakSet.size>0?' ('+weakSet.size+')':'';
}

// ===================== HOME =====================
function calcStreak(days){
  if(!days||days.length===0)return 0;
  const sorted=[...days].sort().reverse();
  const today=new Date().toLocaleDateString('ja-JP');
  const yesterday=new Date(Date.now()-86400000).toLocaleDateString('ja-JP');
  if(sorted[0]!==today&&sorted[0]!==yesterday)return 0;
  let streak=1;
  for(let i=1;i<sorted.length;i++){
    const prev=new Date(new Date(sorted[i-1].replace(/\//g,'-')).getTime()-86400000).toLocaleDateString('ja-JP');
    if(sorted[i]===prev)streak++;else break;
  }
  return streak;
}

function renderHome(){
  // Always reload latest saved data before rendering
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      savedProgress = { weakSet:{}, catProgress:{}, sessions:[], lastSession:{}, totalStudyDays:[], ...p };
    }
  } catch(e) {}

  const body=document.getElementById('home-body');
  const sessions=savedProgress.sessions||[];
  const catProgress=(savedProgress.catProgress&&savedProgress.catProgress[currentLevel])||{};
  const studyDays=savedProgress.totalStudyDays||[];
  let totalCorrect=0,totalWrong=0;
  sessions.filter(s=>s.level===currentLevel).forEach(s=>{totalCorrect+=s.correct;totalWrong+=s.wrong;});
  const totalAnswered=totalCorrect+totalWrong;
  const overallRate=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
  const streak=calcStreak(studyDays);
  const totalKanji=Object.values(ALL_DATA).reduce((s,a)=>s+a.length,0);
  let learnedKanji=0;
  CATS.forEach(cat=>{
    const cp=catProgress[cat];
    const total=ALL_DATA[cat].length;
    if(cp&&cp.answered) learnedKanji+=Math.min(cp.answered.filter(a=>a!==null).length, total);
  });
  const lv=LEVELS[currentLevel];
  const lvClass='lv-tag lv-tag-'+currentLevel;

  const hour=new Date().getHours();
  const greet=hour<12?'おはようございます！':hour<18?'こんにちは！':'こんばんは！';

  let html=`
    <div style="padding:4px 0 12px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:17px;font-weight:700;font-family:'Noto Serif JP',serif;margin-bottom:3px;">${greet} 📚</div>
        <div style="font-size:12px;color:var(--muted);">現在のレベル：<span class="${lvClass}">${lv.label}</span>JLPT合格に向けて頑張りましょう！</div>
      </div>
    </div>`;

  // Streak
  html+=`<div class="streak-row">
    <div class="streak-fire">${streak>0?'🔥':'📅'}</div>
    <div>
      <div class="streak-num">${streak}日</div>
      <div class="streak-lbl">連続学習ストリーク（合計 ${studyDays.length} 日）</div>
    </div>
  </div>`;

  // Summary
  html+=`<div class="summary-grid">
    <div class="summary-card"><div class="summary-num">${learnedKanji}<span style="font-size:12px;color:var(--muted)">/${totalKanji}</span></div><div class="summary-lbl">学習済み漢字</div></div>
    <div class="summary-card"><div class="summary-num c-ok">${overallRate}%</div><div class="summary-lbl">累計正解率</div></div>
    <div class="summary-card"><div class="summary-num">${totalAnswered}</div><div class="summary-lbl">累計回答数</div></div>
    <div class="summary-card"><div class="summary-num c-wk">${weakSet.size}</div><div class="summary-lbl">苦手漢字数</div></div>
  </div>`;

  // Learning advice
  let advice = '';
  if (totalAnswered === 0) {
    advice = `<div style="background:var(--info-bg);border:1px solid #b3c8f0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--info);line-height:1.7;">👋 ようこそ！まずは「フラッシュカード」からスタートしましょう。カードをタップして読み方を確認し、正解・不正解を記録してください。</div>`;
  } else if (overallRate < 60) {
    advice = `<div style="background:var(--weak-bg);border:1px solid #f0d080;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--weak);line-height:1.7;">📖 正解率 ${overallRate}% — フラッシュカードで繰り返し確認しましょう。「苦手復習」モードで集中練習するのが効果的です。</div>`;
  } else if (overallRate < 80) {
    advice = `<div style="background:var(--correct-bg);border:1px solid #a8d5b5;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--correct);line-height:1.7;">📝 正解率 ${overallRate}% — 順調です！「クイズモード」で試験形式の練習もしてみましょう。</div>`;
  } else {
    advice = `<div style="background:var(--correct-bg);border:1px solid #a8d5b5;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--correct);line-height:1.7;">🌟 正解率 ${overallRate}% — 素晴らしい！次のレベルや別カテゴリにもチャレンジしましょう。</div>`;
  }
  html += advice;

  // Quick start
  html+=`<div class="section-label">学習を始める</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px;">
    <button onclick="setMode('flash')" style="padding:13px 8px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;">
      <span style="font-size:20px;">📖</span>フラッシュカード
    </button>
    <button onclick="setMode('quiz')" style="padding:13px 8px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;">
      <span style="font-size:20px;">❓</span>クイズ
    </button>
    ${weakSet.size>0?`<button onclick="setMode('weak')" style="padding:13px 8px;border-radius:12px;border:1px solid #f0d080;background:var(--weak-bg);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;grid-column:span 2;">
      <span style="font-size:20px;">⭐</span>苦手復習（${weakSet.size}字）
    </button>`:''}
  </div>`;

  // Category progress
  html+=`<div class="section-label">カテゴリ別進捗</div>`;
  CATS.forEach(cat=>{
    const cp=catProgress[cat];
    const total=ALL_DATA[cat].length;
    // answered array length may differ from total if cards were added; use total as reference
    const done=cp&&cp.answered?cp.answered.filter(a=>a!==null).length:0;
    const ok=cp?(cp.correct||0):0;
    const ng=cp?(cp.wrong||0):0;
    const tot=ok+ng;
    const rate=tot>0?Math.round(ok/tot*100):0;
    // clamp pctDone to max 100
    const pctDone=Math.min(100,Math.round(done/total*100));
    const pctOk=tot>0?Math.round(ok/tot*100):0;
    const isComplete=pctDone>=100;
    const completeBadge=isComplete?`<span style="font-size:10px;background:var(--correct-bg);color:var(--correct);border-radius:10px;padding:1px 7px;margin-left:6px;">完了✓</span>`:'';
    html+=`<div class="cat-progress-item" onclick="startFlashFromHome('${cat}')" style="cursor:pointer;">
      <div class="cat-progress-header">
        <span class="cat-progress-name">${cat}${completeBadge}</span>
        <span class="cat-progress-pct">${Math.min(done,total)}/${total}枚 ${pctDone>0?'('+pctDone+'%)':''}</span>
      </div>
      <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;display:flex;">
        <div style="width:${pctDone*pctOk/100}%;background:var(--correct);"></div>
        <div style="width:${pctDone*(100-pctOk)/100}%;background:var(--wrong);"></div>
      </div>
      <div class="cat-progress-detail">
        ${tot>0?`<span>✓ ${ok}</span><span>✗ ${ng}</span><span>${rate}%</span>`:'<span>未学習</span>'}
        ${isComplete
          ? `<span onclick="event.stopPropagation();quizCat='${cat}';setMode('quiz')" style="margin-left:auto;font-size:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;cursor:pointer;">クイズ →</span>`
          : `<span style="margin-left:auto;font-size:10px;">タップして学習 →</span>`
        }
      </div>
    </div>`;
  });

  // Recent sessions
  const lvSessions=sessions.filter(s=>s.level===currentLevel).slice(0,5);
  if(lvSessions.length>0){
    html+=`<div class="section-label">最近のセッション</div>`;
    lvSessions.forEach(s=>{
      const col=s.rate>=80?'var(--correct)':s.rate>=60?'var(--weak)':'var(--wrong)';
      html+=`<div class="session-item">
        <div class="session-date">${s.date} <span class="lv-tag lv-tag-${s.level||currentLevel}">${LEVELS[s.level||currentLevel].label}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="session-info">${s.cat} — ${s.mode}</div>
          <div style="font-size:15px;font-weight:700;color:${col};">${s.rate}%</div>
        </div>
        <div class="session-detail">${s.correct}/${s.total}問正解</div>
      </div>`;
    });
  }

  html+=`<button class="clear-btn" onclick="clearAllData()">🗑 全データをリセット</button>`;
  body.innerHTML=html;
}

function clearAllData(){
  // confirm/alertはスマートフォンのWebViewでブロックされる場合があるため独自UIを使用
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center;">
      <div style="font-size:28px;margin-bottom:10px;">🗑</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:8px;">全データをリセット</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7;">全ての学習進捗・苦手漢字・セッション記録が削除されます。この操作は元に戻せません。</div>
      <div style="display:flex;gap:10px;">
        <button id="reset-cancel" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:none;font-size:14px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">キャンセル</button>
        <button id="reset-ok" style="flex:1;padding:12px;border-radius:10px;border:none;background:var(--wrong);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">リセット</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('reset-cancel').onclick = () => overlay.remove();
  document.getElementById('reset-ok').onclick = () => {
    overlay.remove();
    localStorage.removeItem(STORAGE_KEY);
    savedProgress={weakSet:{},catProgress:{},sessions:[],lastSession:{},totalStudyDays:[]};
    weakSet=new Set();
    updateWeakCnt();
    setMode('home');
  };
}

// ===================== INIT =====================
loadProgress();
setMode('home');
</script>
